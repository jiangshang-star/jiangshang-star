name: generate snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Platane/snk@v3
        with:
          github_user_name: jiangshang-star
          outputs: dist/github-contribution-grid-snake-dark.svg
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
